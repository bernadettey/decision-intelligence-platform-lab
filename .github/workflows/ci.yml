name: CI

on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: decision_intelligence
          POSTGRES_USER: fpa_user
          POSTGRES_PASSWORD: fpa_password
        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U fpa_user -d decision_intelligence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Initialize database
        env:
          PGPASSWORD: fpa_password
        run: |
          psql -h localhost -U fpa_user -d decision_intelligence -f database/init.sql
          psql -h localhost -U fpa_user -d decision_intelligence -f database/seed_data.sql
          
      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://fpa_user:fpa_password@localhost:5432/decision_intelligence
        run: python -m pytest -ra    